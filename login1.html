<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | Apex Automotive</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="brand-logo">APEX</div>
        <button class="icon-btn" title="Toggle Theme">🌙</button>
      </div>
      
      <h2 style="margin-top: 25px;">Client Sign In</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Access your vehicle builds and garage fleet management.</p>

      <form class="auth-form">
        <div class="form-group">
          <label style="font-size: 0.85rem;">Email Address</label>
          <input type="email" class="form-input" required placeholder="client@domain.com">
        </div>
        
        <div class="form-group">
          <label style="font-size: 0.85rem;">Password</label>
          <div style="position: relative;">
            <input type="password" class="form-input" required placeholder="••••••••">
            <span style="position: absolute; right: 15px; top: 14px; cursor: pointer; color: var(--text-muted);">👁️</span>
          </div>
        </div>

        <div class="form-options">
          <label><input type="checkbox"> Remember Access</label>
          <a href="#" style="color: var(--primary-color);">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>

      <div style="margin-top: 30px; text-align: center;">
        <p style="font-size: 0.85rem; color: var(--text-muted);">Don't have an account? <a href="register.html" style="color: var(--primary-color);">Request Access</a></p>
      </div>
    </div>
  </div>
</body>
</html>
