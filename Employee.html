<!DOCTYPE html>
<html>
    <head>Employee Salary Calaculator</head>
    <body>
        <script>
            function calculateSalary(basic, hra, da, bonus, tax, pf, insurance) {
    
            var grossSalary = basic + hra + da + bonus;

            var totalDeductions = tax + pf + insurance;

            var netSalary = grossSalary - totalDeductions;

        console.log("----- Salary Statement -----");
        console.log("Basic Salary:    " + basic);
        console.log("Gross Earnings:  " + grossSalary);
        console.log("Total Deductions: " + totalDeductions);
        console.log("Net Salary:      " + netSalary);
        console.log("----------------------------");
    }
    calculateSalary(60000, 10000, 5000, 2000, 1500, 1800, 500);
        </script>
    </body>
</html>
